<svg width="836" height="216" viewBox="0 0 836 216" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stack — languages: Python, SQL, Java, C#, JavaScript; storage: PostgreSQL, MySQL; serve: Power BI, Report Builder; cloud and tools: AWS, PySpark, Airflow, Snowflake">
